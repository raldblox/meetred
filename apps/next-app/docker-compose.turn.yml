services:
  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    environment:
      TURN_USER: ${TURN_USER}
      TURN_PASS: ${TURN_PASS}
    command: >
      -n
      --fingerprint
      --realm=localhost
      --listening-ip=127.0.0.1
      --relay-ip=127.0.0.1
      --min-port=49160
      --max-port=49200
      --user=${TURN_USER}:${TURN_PASS}
